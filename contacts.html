<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Cards Website</title>
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- MY CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- FAVICON -->
    <link rel="shortcut icon" href="media/favicon.ico" type="image/x-icon">
</head>

<body class="bg-p">
    <!-- NAVBAR + OFFCANVAS NAVBAR -->
    <div class="navbar-placeholder">
        <!-- NAVBAR + OFFCANVAS NAVBAR CONTENT VIA LAYOUT.JS -->
    </div>

    <!-- PROMO BAR -->
    <div class="promobar-placeholder">
        <!-- PROMO BAR CONTENT VIA LAYOUT.JS -->
    </div>

    <!-- HEADER -->
    <header>
    </header>
    <!-- MAIN -->
    <main>
        <div class="container margin-navbar">
            <div class="row justify-content-center my-3">
                <div class="col-12 text-center ">
                    <h1 class="title header-title">Contact Us</h1>
                    <p class="color-s">Have questions about our cards or your order? We are here to help!</p>
                </div>
                <!-- EMAIL -->
                <div class="card card-border col-12 col-sm-7 col-md-6 col-lg-4 col-xxl-3 p-0">
                    <div
                        class="card-body card-border bg-p d-flex flex-column justify-content-center align-items-center border">
                        <i class="bi bi-envelope-at-fill mb-3 color-a fs-1"></i>
                        <h5 class="card-title color-s text-center">Email</h5>
                        <p class="card-text m-0 color-s text-center">support@tcw.com</p>
                        <a href="mailto:support@tcw.com" class="btn btn-cart mt-3">Send Email</a>
                    </div>
                </div>
                <!-- SOCIAL -->
                <div class="col-12 d-flex flex-wrap justify-content-center gap-4 my-3">
                    <div class="card card-border col-12 col-sm-7 col-md-6 col-lg-4 col-xxl-3">
                        <div
                            class="card-body card-border bg-p d-flex flex-column justify-content-center align-items-center border">
                            <i class="bi bi-instagram mb-3 color-a fs-1"></i>
                            <h5 class="card-title color-s text-center">Instagram</h5>
                            <p class="card-text m-0 color-s text-center">Join our community</p>
                            <a href="#" class="btn btn-cart mt-3">Follow Us</a>
                        </div>
                    </div>
                    <div class="card card-border col-12 col-sm-7 col-md-6 col-lg-4 col-xxl-3">
                        <div
                            class="card-body card-border bg-p d-flex flex-column justify-content-center align-items-center border">
                            <i class="bi bi-tiktok mb-3 color-a fs-1"></i>
                            <h5 class="card-title color-s text-center">TikTok</h5>
                            <p class="card-text m-0 color-s text-center">Join our community</p>
                            <a href="#" class="btn btn-cart mt-3">Follow Us</a>
                        </div>
                    </div>
                </div>
                <!-- MAPS -->
                <div class="card card-border col-12 col-sm-7 col-md-6 col-lg-4 col-xxl-3 p-0">
                        <div
                            class="card-body card-border bg-p d-flex flex-column justify-content-center align-items-center border">
                            <i class="bi bi-geo-alt-fill mb-3 color-a fs-1"></i>
                            <h5 class="card-title color-s text-center">Location</h5>
                            <p class="card-text m-0 color-s text-center">15 Card Street, Milan, IT</p>
                            <a href="https://www.google.com/maps/dir/?api=1&destination=Milan,Metropolitan City of Milan" target="_blank" class="btn btn-cart mt-3">Get Directions</a>
                        </div>
                    </div>
            </div>
        </div>
    </main>
    <!-- FOOTER -->
    <hr class="footer-hr m-0">
    <div class="footer-placeholder">
        <!-- FOOTER CONTENT VIA LAYOUT.JS -->
    </div>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- MY JS -->
    <script src="js/layout.js"></script>
    <script src="js/category.js"></script>
</body>

</html>
