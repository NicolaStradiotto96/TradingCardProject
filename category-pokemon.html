<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Cards Website</title>
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- MY CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- FAVICON -->
    <link rel="shortcut icon" href="media/favicon.ico" type="image/x-icon">
</head>

<body class="bg-p">
    <!-- NAVBAR + OFFCANVAS NAVBAR -->
    <div class="navbar-placeholder">
        <!-- NAVBAR + OFFCANVAS NAVBAR CONTENT VIA LAYOUT.JS -->
    </div>

    <!-- PROMO BAR -->
    <div class="promobar-placeholder">
        <!-- PROMO BAR CONTENT VIA LAYOUT.JS -->
    </div>

    <!-- HEADER -->
    <header>
    </header>

    <!-- MAIN -->
    <main>
        <section class="cards-category pb-5 p-lg-5 pt-lg-0">
            <div class="margin-navbar row m-0">
                <!-- FILTERS -->
                <div class="col-12 col-lg-2 justify-content-center align-items-baseline pt-0 gx-0">
                    <h3 class="title filters-title text-center px-2">FILTERS</h3>
                    <!-- PRICE FILTER -->
                    <div class="d-flex flex-column justify-content-center align-items-center my-5">
                        <label for="price-filter" class="form-label color-s" id="price-label">Price</label>
                        <input type="range" class="card-filter form-range" min="" max="" value="" step="1"
                            id="price-filter">
                    </div>
                    <!-- WORD FILTER -->
                    <div class="d-flex flex-column justify-content-center align-items-center my-5">
                        <label class="color-s mb-2" for="word-filter">Search Your Card</label>
                        <input type="text" class="card-filter form-control" id="word-filter" placeholder="Type here">
                    </div>
                    <!-- AVAILABLE FILTER -->
                    <div class="d-flex flex-column justify-content-center align-items-center my-5">
                        <label class="color-s" for="available-filter">Only Available</label>
                        <input type="checkbox" class="form-check-input" id="available-filter">
                    </div>
                </div>
                <!-- CARDS -->
                <div class="col-12 col-lg-10 pt-0 gx-0">
                    <h1 class="title category-title text-center px-2">CARDS</h1>
                    <div class="row justify-content-center align-items-center px-5 py-0 gx-0" id="categories-wrapper">
                        <!-- CARDS CONTENT VIA JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <hr class="footer-hr m-0">
    <div class="footer-placeholder">
        <!-- FOOTER CONTENT VIA LAYOUT.JS -->
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- MY JS -->
    <script src="js/layout.js"></script>
    <script src="js/category.js"></script>
</body>

</html>
